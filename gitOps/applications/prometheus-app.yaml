apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/skalyandev/devOps-playBook.git
    targetRevision: gitops-dev
    path: monitoring/prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: ns-mbl-monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
