apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/skalyandev/devOps-playBook.git
    targetRevision: gitops-dev
    path: gitOps/monitoring/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
